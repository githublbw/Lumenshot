<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C · Bento 卡片分区</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#040405;display:grid;place-items:center;overflow:hidden;
    font-family:Inter,"Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
  }
  .frame{width:610px;height:446px;transform:scale(2);transform-origin:center;
         position:relative;overflow:hidden}
  .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;
      stroke-linecap:round;stroke-linejoin:round;display:block}

  .c{background:#08080A;color:#F4F4F5;padding:14px 16px 16px;
     display:flex;flex-direction:column;gap:10px}
  .card{background:#0D0D10;border:1px solid rgba(255,255,255,.065);
        border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}

  header{height:28px;display:flex;align-items:center;gap:9px}
  .mark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
        color:#A3F0CE;background:rgba(163,240,206,.08);
        border:1px solid rgba(163,240,206,.15)}
  .mark .ic{width:15px;height:15px}
  .word{font-size:13px;font-weight:500}
  .spacer{flex:1}
  .kbd{font-size:10px;color:#8A8A93;border:1px solid rgba(255,255,255,.09);
       background:rgba(255,255,255,.03);border-radius:5px;padding:2px 5px}
  .kbd+.kbd{margin-left:2px}
  .icon-btn{width:28px;height:28px;border-radius:7px;border:0;background:transparent;
            color:#8A8A93;display:grid;place-items:center}
  .icon-btn .ic{width:16px;height:16px}

  .preview{flex:1;padding:12px 14px;display:flex;flex-direction:column;min-height:0}
  .card-head{display:flex;align-items:center;justify-content:space-between;
             height:16px;flex:none}
  .label{font-size:9.5px;letter-spacing:.14em;color:#6E6E77;font-weight:500}
  .meta{font-size:10px;color:#5C5C64}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:8px}
  .empty .ring{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
               color:#A3F0CE;background:rgba(163,240,206,.06);
               border:1px solid rgba(163,240,206,.14);margin-bottom:2px}
  .empty .ring .ic{width:22px;height:22px;stroke-width:1.5}
  .empty h1{font-size:16px;font-weight:500;letter-spacing:-.1px}
  .empty p{font-size:11px;color:#82828B}

  .bento{display:flex;gap:10px;height:88px;flex:none}
  .bento .card{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  .tools{flex:1.35}
  .out{flex:.95}
  .row{display:flex;align-items:center;gap:2px}
  .tool{width:28px;height:28px;border-radius:7px;border:0;background:transparent;
        color:#B0B0B8;display:grid;place-items:center;opacity:.30}
  .tool .ic{width:16px;height:16px}
  .sep{width:1px;height:14px;background:rgba(255,255,255,.08);margin:0 4px}
  .out .btns{display:flex;gap:6px}
  .ob{flex:1;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.02);color:#9A9AA2;font-size:10.5px;
      display:flex;align-items:center;justify-content:center;gap:4px;opacity:.55}
  .ob .ic{width:13px;height:13px}

  .capture{height:40px;display:flex;gap:8px;flex:none}
  .primary{flex:1.5;border:0;border-radius:9px;
           background:linear-gradient(#BCF7DF,#A3F0CE);color:#07120E;
           font-size:12px;font-weight:600;display:flex;align-items:center;
           justify-content:center;gap:6px;
           box-shadow:inset 0 1px 0 rgba(255,255,255,.50)}
  .primary .ic{width:16px;height:16px;stroke-width:1.9}
  .ghost{flex:1;border:1px solid rgba(255,255,255,.08);
         background:rgba(255,255,255,.015);color:#B4B4BB;border-radius:9px;
         font-size:11.5px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-aperture" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94"/><path d="M9.69 8h11.48"/><path d="m7.38 12 5.74-9.94"/><path d="M9.69 16 3.95 6.06"/><path d="M14.31 16H2.83"/><path d="m16.62 12-5.74 9.94"/></symbol>
  <symbol id="i-focus" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-rect" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></symbol>
  <symbol id="i-blend" viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h2"/><path d="M17 4h2a2 2 0 0 1 2 2v2"/><path d="M21 16v2a2 2 0 0 1-2 2h-2"/><path d="M7 20H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></symbol>
</defs></svg>

<div class="frame c">
  <header>
    <span class="mark"><svg class="ic"><use href="#i-aperture"/></svg></span>
    <span class="word">Lumenshot</span>
    <span class="spacer"></span>
    <span class="kbd">Ctrl</span><span class="kbd">Alt</span><span class="kbd">A</span>
    <button class="icon-btn"><svg class="ic"><use href="#i-more"/></svg></button>
  </header>

  <section class="card preview">
    <div class="card-head"><span class="label">预览</span><span class="meta">尚无图像</span></div>
    <div class="empty">
      <div class="ring"><svg class="ic"><use href="#i-focus"/></svg></div>
      <h1>还没有截图</h1>
      <p>选一种方式开始捕获当前屏幕</p>
    </div>
  </section>

  <div class="bento">
    <section class="card tools">
      <div class="card-head"><span class="label">标注工具</span><span class="meta">有截图后启用</span></div>
      <div class="row">
        <button class="tool"><svg class="ic"><use href="#i-rect"/></svg></button>
        <button class="tool"><svg class="ic"><use href="#i-circle"/></svg></button>
        <button class="tool"><svg class="ic"><use href="#i-arrow"/></svg></button>
        <button class="tool"><svg class="ic"><use href="#i-type"/></svg></button>
        <button class="tool"><svg class="ic"><use href="#i-blend"/></svg></button>
        <button class="tool"><svg class="ic"><use href="#i-grid"/></svg></button>
        <span class="sep"></span>
        <button class="tool"><svg class="ic"><use href="#i-undo"/></svg></button>
        <button class="tool"><svg class="ic"><use href="#i-redo"/></svg></button>
      </div>
    </section>

    <section class="card out">
      <div class="card-head"><span class="label">输出</span></div>
      <div class="btns">
        <button class="ob"><svg class="ic"><use href="#i-pin"/></svg>置顶</button>
        <button class="ob"><svg class="ic"><use href="#i-copy"/></svg>复制</button>
        <button class="ob"><svg class="ic"><use href="#i-save"/></svg>保存</button>
      </div>
    </section>
  </div>

  <div class="capture">
    <button class="primary"><svg class="ic"><use href="#i-scan"/></svg>区域截图</button>
    <button class="ghost">窗口截图</button>
    <button class="ghost">整屏截图</button>
  </div>
</div>
</body>
</html>
