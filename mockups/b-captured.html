<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>B · 已截图状态</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#040405;display:grid;place-items:center;overflow:hidden;
    font-family:Inter,"Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
  }
  .frame{width:610px;height:446px;transform:scale(2);transform-origin:center;
         position:relative;overflow:hidden;background:#0A0A0C}
  .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;
      stroke-linecap:round;stroke-linejoin:round;display:block}

  .b{color:#F4F4F5}
  .shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .edge{position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
        pointer-events:none}
  .scrim-top{position:absolute;left:0;right:0;top:0;height:110px;
    background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0))}
  .scrim-bottom{position:absolute;left:0;right:0;bottom:0;height:130px;
    background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55))}

  .pill{position:absolute;display:flex;align-items:center;gap:8px;
        background:rgba(14,14,17,.80);border:1px solid rgba(255,255,255,.11);
        border-radius:999px;backdrop-filter:blur(10px);
        box-shadow:0 8px 24px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.06)}
  .top-left{left:16px;top:16px;height:34px;padding:0 12px 0 8px}
  .logo{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
        color:#A3F0CE;background:rgba(163,240,206,.12)}
  .logo .ic{width:14px;height:14px}
  .brand{font-size:12px;font-weight:500;letter-spacing:.2px}
  .vsep{width:1px;height:14px;background:rgba(255,255,255,.13)}
  .dot{width:5px;height:5px;border-radius:999px;background:#A3F0CE;
       box-shadow:0 0 0 3px rgba(163,240,206,.14)}
  .state{font-size:11px;color:#C3C3CA}
  .size{font-size:10.5px;color:#8E8E97;letter-spacing:.2px}

  .top-right{right:16px;top:16px;height:34px;padding:0 6px;gap:2px}
  .ico{width:28px;height:28px;border-radius:8px;border:0;background:transparent;
       color:#D6D6DC;display:grid;place-items:center}
  .ico .ic{width:16px;height:16px}
  .ico:hover{background:rgba(255,255,255,.08)}

  .dock{position:absolute;left:0;right:0;bottom:18px;margin:0 auto;width:max-content;
        height:48px;padding:0 8px;display:flex;align-items:center;gap:3px;border-radius:14px}
  .mode{height:34px;padding:0 12px;border-radius:9px;border:0;background:transparent;
        color:#A6A6AE;font-size:11.5px;display:flex;align-items:center;gap:6px;
        white-space:nowrap;flex:none}
  .mode .ic{width:15px;height:15px}
  .vsep2{width:1px;height:18px;background:rgba(255,255,255,.12);margin:0 6px}
  .tool{width:32px;height:32px;border-radius:8px;border:0;background:transparent;
        color:#D2D2D8;display:grid;place-items:center;flex:none}
  .tool .ic{width:17px;height:17px}
  .tool.active{color:#A3F0CE;background:rgba(163,240,206,.13);
               box-shadow:inset 0 0 0 1px rgba(163,240,206,.22)}
  .tool.off{opacity:.28}
  .swatch{width:22px;height:22px;border-radius:999px;background:#050505;
          border:1px solid rgba(255,255,255,.40);flex:none;
          box-shadow:0 0 0 3px rgba(0,0,0,.18)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-aperture" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94"/><path d="M9.69 8h11.48"/><path d="m7.38 12 5.74-9.94"/><path d="M9.69 16 3.95 6.06"/><path d="M14.31 16H2.83"/><path d="m16.62 12-5.74 9.94"/></symbol>
  <symbol id="i-rect" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></symbol>
  <symbol id="i-blend" viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h2"/><path d="M17 4h2a2 2 0 0 1 2 2v2"/><path d="M21 16v2a2 2 0 0 1-2 2h-2"/><path d="M7 20H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></symbol>
</defs></svg>

<div class="frame b">
  <img class="shot" src="sample.png?v=2" alt="">
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>
  <div class="edge"></div>

  <div class="pill top-left">
    <span class="logo"><svg class="ic"><use href="#i-aperture"/></svg></span>
    <span class="brand">Lumenshot</span>
    <span class="vsep"></span>
    <span class="dot"></span>
    <span class="state">已截取</span>
    <span class="size">1280 × 720</span>
  </div>

  <div class="pill top-right">
    <button class="ico"><svg class="ic"><use href="#i-pin"/></svg></button>
    <button class="ico"><svg class="ic"><use href="#i-copy"/></svg></button>
    <button class="ico"><svg class="ic"><use href="#i-save"/></svg></button>
  </div>

  <div class="pill dock">
    <button class="mode"><svg class="ic"><use href="#i-scan"/></svg>区域</button>
    <button class="mode"><svg class="ic"><use href="#i-window"/></svg>窗口</button>
    <button class="mode"><svg class="ic"><use href="#i-monitor"/></svg>整屏</button>
    <span class="vsep2"></span>
    <button class="tool active"><svg class="ic"><use href="#i-rect"/></svg></button>
    <button class="tool"><svg class="ic"><use href="#i-circle"/></svg></button>
    <button class="tool"><svg class="ic"><use href="#i-arrow"/></svg></button>
    <button class="tool"><svg class="ic"><use href="#i-type"/></svg></button>
    <button class="tool"><svg class="ic"><use href="#i-blend"/></svg></button>
    <button class="tool"><svg class="ic"><use href="#i-grid"/></svg></button>
    <span class="vsep2"></span>
    <span class="swatch"></span>
    <span class="vsep2"></span>
    <button class="tool off"><svg class="ic"><use href="#i-undo"/></svg></button>
    <button class="tool off"><svg class="ic"><use href="#i-redo"/></svg></button>
  </div>
</div>
</body>
</html>
