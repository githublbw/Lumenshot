<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>D · 左侧工具轨</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#040405;display:grid;place-items:center;overflow:hidden;
    font-family:Inter,"Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;
  }
  .frame{width:610px;height:446px;transform:scale(2);transform-origin:center;
         position:relative;overflow:hidden}
  .ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;
      stroke-linecap:round;stroke-linejoin:round;display:block}

  .d{display:flex;background:#09090B;color:#F4F4F5;overflow:hidden}

  .rail{width:54px;flex:none;background:#0B0B0D;border-right:1px solid #191A1D;
        display:flex;flex-direction:column;align-items:center;padding:13px 0 12px;gap:4px}
  .logomark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
            color:#A3F0CE;background:rgba(163,240,206,.08);
            border:1px solid rgba(163,240,206,.16);margin-bottom:10px}
  .logomark .ic{width:16px;height:16px}
  .rtool{width:34px;height:34px;border-radius:9px;border:0;background:transparent;
         color:#9C9CA4;display:grid;place-items:center;position:relative}
  .rtool .ic{width:17px;height:17px}
  .rtool.active{color:#A3F0CE;background:rgba(163,240,206,.10);
                box-shadow:inset 0 0 0 1px rgba(163,240,206,.18)}
  .rtool.dis{opacity:.30}
  .rail .grow{flex:1}
  .rsep{width:20px;height:1px;background:rgba(255,255,255,.07);margin:5px 0}

  .main{flex:1;display:flex;flex-direction:column;padding:11px 14px 13px;gap:10px;min-width:0}
  .topbar{height:26px;display:flex;align-items:center;gap:10px}
  .title{font-size:12.5px;font-weight:500;letter-spacing:.1px}
  .sub{font-size:10.5px;color:#6E6E77}
  .spacer{flex:1}
  .kbd{font-size:10px;color:#8A8A93;border:1px solid rgba(255,255,255,.08);
       background:rgba(255,255,255,.025);border-radius:5px;padding:2px 5px}
  .kbd+.kbd{margin-left:2px}
  .icon-btn{width:26px;height:26px;border-radius:7px;border:0;background:transparent;
            color:#8A8A93;display:grid;place-items:center}
  .icon-btn .ic{width:16px;height:16px}

  .preview{flex:1;border-radius:12px;background:#0C0C0E;
           border:1px solid #1A1B1E;position:relative;overflow:hidden;
           display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
  .preview::before{content:"";position:absolute;inset:0;
    background:radial-gradient(360px 180px at 50% 42%,rgba(163,240,206,.035),transparent 72%)}
  .ring{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;
        color:#A3F0CE;background:rgba(163,240,206,.06);
        border:1px solid rgba(163,240,206,.14);position:relative}
  .ring .ic{width:23px;height:23px;stroke-width:1.5}
  .preview h1{font-size:15px;font-weight:500;position:relative}
  .preview p{font-size:11px;color:#81818A;position:relative}
  .sizetag{position:absolute;left:10px;bottom:9px;font-size:10px;color:#4F4F57}

  .bottom{height:40px;display:flex;gap:7px;flex:none}
  .primary{flex:1.5;border:0;border-radius:9px;background:linear-gradient(#BCF7DF,#A3F0CE);
           color:#07120E;font-size:12px;font-weight:600;display:flex;align-items:center;
           justify-content:center;gap:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .primary .ic{width:16px;height:16px;stroke-width:1.9}
  .ghost{flex:1;border:1px solid rgba(255,255,255,.08);background:transparent;
         color:#AFAFB7;border-radius:9px;font-size:11px;
         display:flex;align-items:center;justify-content:center;gap:5px}
  .ghost .ic{width:14px;height:14px;color:#8E8E97}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-aperture" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m14.31 8 5.74 9.94"/><path d="M9.69 8h11.48"/><path d="m7.38 12 5.74-9.94"/><path d="M9.69 16 3.95 6.06"/><path d="M14.31 16H2.83"/><path d="m16.62 12-5.74 9.94"/></symbol>
  <symbol id="i-focus" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-rect" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></symbol>
  <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></symbol>
  <symbol id="i-blend" viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h4"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h2"/><path d="M17 4h2a2 2 0 0 1 2 2v2"/><path d="M21 16v2a2 2 0 0 1-2 2h-2"/><path d="M7 20H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></symbol>
  <symbol id="i-window" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
</defs></svg>

<div class="frame d">
  <aside class="rail">
    <div class="logomark"><svg class="ic"><use href="#i-aperture"/></svg></div>
    <button class="rtool active"><svg class="ic"><use href="#i-rect"/></svg></button>
    <button class="rtool dis"><svg class="ic"><use href="#i-circle"/></svg></button>
    <button class="rtool dis"><svg class="ic"><use href="#i-arrow"/></svg></button>
    <button class="rtool dis"><svg class="ic"><use href="#i-type"/></svg></button>
    <button class="rtool dis"><svg class="ic"><use href="#i-blend"/></svg></button>
    <button class="rtool dis"><svg class="ic"><use href="#i-grid"/></svg></button>
    <div class="grow"></div>
    <button class="rtool dis"><svg class="ic"><use href="#i-undo"/></svg></button>
    <button class="rtool dis"><svg class="ic"><use href="#i-redo"/></svg></button>
    <div class="rsep"></div>
    <button class="rtool"><svg class="ic"><use href="#i-more"/></svg></button>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="title">截图工作台</span>
      <span class="sub">Lumenshot</span>
      <span class="spacer"></span>
      <span class="kbd">Ctrl</span><span class="kbd">Alt</span><span class="kbd">A</span>
    </div>

    <section class="preview">
      <div class="ring"><svg class="ic"><use href="#i-focus"/></svg></div>
      <h1>等待截图</h1>
      <p>选择下方方式，或按快捷键开始</p>
      <span class="sizetag">尚无图像</span>
    </section>

    <div class="bottom">
      <button class="primary"><svg class="ic"><use href="#i-scan"/></svg>区域截图</button>
      <button class="ghost"><svg class="ic"><use href="#i-window"/></svg>窗口</button>
      <button class="ghost"><svg class="ic"><use href="#i-monitor"/></svg>整屏</button>
    </div>
  </main>
</div>
</body>
</html>
